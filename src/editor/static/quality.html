<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="quality.title"></title>
    <link rel="stylesheet" href="/static/quality.css">
  </head>
  <body>
    <header class="quality-header">
      <div>
        <h1 data-i18n="quality.title"></h1>
        <span id="refresh-status" aria-live="polite" data-i18n="quality.loading"></span>
      </div>
      <button id="refresh-quality" type="button" data-i18n="action.refresh"></button>
    </header>

    <nav id="quality-tabs" data-i18n-aria-label="quality.sections">
      <button class="active" type="button" data-view="dashboard" data-i18n="quality.dashboard"></button>
      <button type="button" data-view="errors" data-i18n="quality.errors"></button>
      <button type="button" data-view="warnings" data-i18n="quality.warnings"></button>
      <button type="button" data-view="coverage" data-i18n="quality.coverage"></button>
      <button type="button" data-view="statistics" data-i18n="quality.statistics"></button>
      <button type="button" data-view="activity" data-i18n="quality.activity"></button>
      <button type="button" data-view="checklist" data-i18n="quality.checklist"></button>
    </nav>

    <main id="quality-content" tabindex="-1"></main>
    <script src="/static/i18n.js"></script>
    <script src="/static/quality.js"></script>
  </body>
</html>
